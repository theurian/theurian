version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Stub bumps move only a fourth version segment, which update-types never
      # matches, so without this group each one would open its own PR.
      type-stubs:
        patterns: ["types-*"]
      # Minor and patch as Dependabot reads x.y.z, so 0.x minors are included.
      # A dependency with a newer major gets only its own major PR.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pre-1.0 and young-major dependencies are upgraded deliberately, not on a
      # schedule: a breaking change here means a rewrite of one adapter, and it
      # needs a human reading the changelog (ADR-0014).
      - dependency-name: "sqlite-vec"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
