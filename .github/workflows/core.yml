name: Core

# Runs only when Core, the shared schemas, or the toolchain change (§29).
# Plugin-only pull requests should not pay for a Core matrix.
#
# `.github/workflows/*.yml` is in the list -- every workflow file, this one
# included -- because two suites read workflow text rather than merely being
# run by it, and this is the only workflow that runs either suite on a push or
# a pull request. (`shared.yml` and `plugin.yml` run then too, but between them
# they select only named files under `packages/` and `-m contract`, which no
# test in either suite carries. `pages.yml` runs no tests at all and has no
# `pull_request` trigger. `release-core.yml` does run the whole suite, but only
# on a `core-v*` tag or a manual dispatch -- after the change has landed, which
# is too late to gate it.)
#
#   * `tests/release/` extracts `release-core.yml`'s step bodies and runs them.
#     Those tests are the only automated check the publication path has, and it
#     executes exactly once per tag push otherwise -- in production, on a
#     release nobody can un-publish. Uncovered, an edit to the release workflow
#     alone would change the subject without running its tests, which is the
#     same as having none.
#   * `tests/ci/` reads `security.yml` and `red-team.yml` by name, and
#     `test_job_timeouts.py` globs the whole directory: its subject is the
#     eighth workflow file as much as the seventh. Naming files one at a time
#     is what #762 found -- an edit to `security.yml` alone, and a new workflow
#     carrying no `timeout-minutes` at all, each landed green.
#
# `release-core.yml` is *also* listed by name, redundantly against that glob and
# on purpose: `tests/release`'s
# `test_a_change_to_the_workflow_under_test_runs_this_file` asserts that exact
# string is present, not that the filter covers the file. Delete the entry and
# that assertion together, never one alone.
#
# GitHub's `*` does not cross a `/`, so the pattern is that directory and
# nothing deeper. It does mean a `plugin.yml`- or `pages.yml`-only edit now
# pays for a Core matrix: that is the price of `test_job_timeouts` covering
# those files at all. `tests/ci/test_core_paths_filter_covers_reads.py` derives
# the read set from those modules and fails when this filter stops covering it.
# It also rejects a filter entry containing `?`, `+`, `[` or `]`: GitHub reads
# those as quantifiers and a character class, and that checker does not.
on:
  push:
    branches: [main]
    paths:
      - "packages/theurian-core/**"
      - "schemas/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      # Every workflow file, and `release-core.yml` again by name; the top of
      # this file says why both lines are here.
      - ".github/workflows/*.yml"
      - ".github/workflows/release-core.yml"
      # The four below are read BY `tests/ci/`, whose prose pins hold this
      # repository's workflow text and its process documentation to each other.
      # An edit to one of them is exactly what breaks those pins, and without
      # these lines it is the one change that runs none of them.
      - "docs/contributing/orchestration.md"
      - "docs/contributing/release.md"
      - "CLAUDE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # The corpus governance guard has to run when only the corpus changes:
      # an edited body with its `contentSha256` re-pinned to match is the
      # exact shape it exists to catch, and nothing else here would run.
      - ".theurian/**"
      # Two of that guard's rules read the managed block in `.gitignore`.
      - ".gitignore"
  pull_request:
    paths:
      - "packages/theurian-core/**"
      - "schemas/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      # Every workflow file, and `release-core.yml` again by name; the top of
      # this file says why both lines are here.
      - ".github/workflows/*.yml"
      - ".github/workflows/release-core.yml"
      # The four below are read BY `tests/ci/`, whose prose pins hold this
      # repository's workflow text and its process documentation to each other.
      # An edit to one of them is exactly what breaks those pins, and without
      # these lines it is the one change that runs none of them.
      - "docs/contributing/orchestration.md"
      - "docs/contributing/release.md"
      - "CLAUDE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # The corpus governance guard has to run when only the corpus changes:
      # an edited body with its `contentSha256` re-pinned to match is the
      # exact shape it exists to catch, and nothing else here would run.
      - ".theurian/**"
      # Two of that guard's rules read the managed block in `.gitignore`.
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.2"

jobs:
  # This workflow's only per-job path filter. Every other job here runs
  # whenever the workflow triggers at all, gated by the `on:` block above --
  # coarse on purpose (see that block's own comment on the corpus-governance
  # guard: a job that runs and finds nothing costs one run, and narrowing costs
  # keeping two filters in step by hand). `retrieval-baseline` below earns a
  # narrower gate anyway, because its own cost is not "one wasted run" -- it
  # rebuilds four SQLite indexes (the base pair plus the raptor-on pair,
  # Phase A slice S4c) and runs the whole harness query set against each pair
  # -- and because "a path that can move retrieval quality" is a small,
  # nameable set, unlike the corpus-governance guard's population.
  #
  # `pyproject.toml` and `uv.lock` are deliberately not in `retrieval`'s own
  # list below, and the reason is not that cost: it is that both are already
  # in this workflow's top-level `on.paths`, so a dependency bump that changed
  # the harness's own output already runs `test`'s `test_baseline_current.py`
  # on every trigger, and that pin is non-advisory -- it goes red before this
  # job's own advisory finding would ever be the one that mattered.
  #
  # `dorny/paths-filter@v4` rather than a new mechanism: it is already this
  # repository's answer to "gate one job narrower than a whole workflow"
  # (`shared.yml`'s own `changes` job). All four `retrieval` patterns below are
  # already inside this workflow's own top-level `on.paths` (`packages/
  # theurian-core/**`, `tools/**` and `tests/**` each cover one; the fourth,
  # this file, is covered by `.github/workflows/*.yml`), so this job narrows
  # which job runs; it starts no run the workflow would not already have.
  #
  # `.github/workflows/core.yml` is in `retrieval`'s own list for the reason
  # #769 exists -- a change to this job's own definition has to be able to run
  # it -- and it is wider than "retrieval quality" in exactly the direction
  # #769 already accepted for the top-level filter: an edit to an unrelated
  # job in this file also flips this output to `true`. Machine-checked against
  # what `tools/eval/compare_baseline.py` (and the `tools/eval` siblings it
  # imports) actually reads by
  # `tests/ci/test_core_paths_filter_covers_reads.py`'s own second check.
  changes:
    name: Detect retrieval-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retrieval: ${{ steps.filter.outputs.retrieval }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            retrieval:
              - 'packages/theurian-core/src/**'
              - 'tools/eval/**'
              - 'tests/fixtures/eval/**'
              - '.github/workflows/core.yml'

  quality:
    name: Format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen so a resolution change fails here rather than silently
      # landing in a release (ADR-0014).
      - run: uv sync --frozen
      - run: uv run ruff format --check packages tests tools
      - run: uv run ruff check --output-format=github packages tests tools
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # #104: observed p95 ~7.3 min on ubuntu-latest / ~5.9 min on macos-latest
    # over 28 runs (worst observed 7.48 min); this is roughly 4x that tail,
    # not the repository floor. This is the job the liveness guard in
    # `RetrievalService._visible_ranking` protects (docs/work-logs and #16):
    # a regression that removes the guard hangs this job, not fails it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 clone. The corpus governance
          # guard in `test_dogfood_corpus_governance.py` checks each pinned body
          # under `.theurian/` against `git show <sourceAnchor.commitSha>:<path>`,
          # and a shallow clone does not hold the anchor commit -- so that rule
          # skips itself instead of running. It is the only check that catches a
          # committed body edited with its `contentSha256` re-pinned to match, so
          # a local-only run of it defeats the point: CI is where a hostile or
          # careless pull request arrives.
          #
          # Cost, measured 2026-08-20 with a fresh clone of main at f702736:
          # 133 commits, 6.56 MiB packed for the full history against 2.77 MiB
          # for a depth-1 single-branch clone. Under 4 MiB more per job.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: Unit and integration tests
        run: uv run pytest -m "not e2e" --cov --cov-report=xml --cov-report=term
      - name: Contract tests against the installed CLI
        run: uv run pytest -m contract -v
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml

  # ADVISORY -- ADR-0036 decision 4, Phase A slice S4b. The roadmap's Phase A
  # Exit-criteria row: "A baseline report is committed and CI reports
  # regressions against it." Whether this ever becomes a blocking gate is a
  # separate decision that row explicitly defers; this job is the advisory
  # half, and no other.
  #
  # A sibling job, not a step tacked onto `test` above, for two reasons. First,
  # `test` runs the harness once per matrix leg already (`test_baseline_current
  # .py`, `test_harness_pins.py`) -- adding this here would rebuild all four
  # SQLite indexes and re-run every query a second time, on both operating
  # systems, for a check whose answer does not depend on the matrix. Second, GitHub
  # skips the remaining steps in a job once one step fails: bolted onto `test`,
  # this step would never run on exactly the pull requests most likely to have
  # moved the baseline without updating it -- the one case its own output is
  # most useful for.
  #
  # `tools/eval/compare_baseline.py --advisory` is what keeps this from ever
  # failing the job. That module's own docstring is the one authority for what
  # `--advisory` covers and why -- read it there rather than here, so the claim
  # has one place to go stale.
  retrieval-baseline:
    name: Retrieval baseline comparison (advisory)
    runs-on: ubuntu-latest
    # The harness builds four indexes (the base pair plus the raptor-on pair,
    # Phase A slice S4c) and runs the full query set against each pair once;
    # measured ~15s locally, this job's own command (`uv run python
    # tools/eval/compare_baseline.py --advisory --format github`). Sized like
    # `corpus-drift` in `shared.yml` (10) plus margin for a colder runner and
    # index build, not off an observed CI tail -- there is no run history for
    # this job yet.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.retrieval == 'true'
    steps:
      # Default depth-1 clone: the comparison reads the working tree and the
      # committed baseline file, never git history.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Compare a fresh harness run against the committed baseline
        run: uv run python tools/eval/compare_baseline.py --advisory --format github --summary

  offline:
    name: Full suite with no network
    runs-on: ubuntu-latest
    # #104: observed p95 ~4.5 min over 30 runs, which alone would suggest
    # ~18 min (4x). Set higher instead: the three steps below already carry
    # a combined step-level budget of 30 min (10 + 15 + 5), added for the
    # network-sandbox invariant this job proves, + checkout/setup overhead
    # (measured max 0.12 min). A job-level timeout tighter than the steps it
    # wraps would fire before those steps ever could -- and a future step
    # added to this job cannot be sized as if 30 + its own minutes were the
    # whole budget; the overhead is real and already spoken for.
    #
    # That is why this moved 30 -> 35 with the suite step's 10 -> 15: at 30 the
    # job ceiling had become exactly the step sum, so the overhead above would
    # have made the job fire first and the step budgets unreachable.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs the same `-m "not e2e"` selection as `test`, so it runs
          # the corpus governance guard too and needs the anchor commits for the
          # same reason -- see the `test` job's checkout for the rule and the
          # measured cost. Safe inside the network namespace below: the checkout
          # happens before it, and `git show` reads objects that are already on
          # disk.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
        timeout-minutes: 10

      # OSS-13 and ADR-0009: a contributor without a paid API key must be able to
      # run everything. This job is what keeps that true rather than aspirational.
      #
      # The isolation is a network namespace around the test process, not a
      # global `iptables -P OUTPUT DROP`. That policy would also sever the
      # runner's own connection to GitHub, hanging the job until it is killed --
      # a failure mode that says nothing about whether the tests need network.
      #
      # The timeout below bounds that hang, not the suite: 15 rather than the
      # 10 set when this step was written (5513d84c, Milestone 1). The suite
      # has outgrown 10 -- the same `-m 'not e2e'` selection measured 478s at
      # the 0.1.0 cut (run 33942378921), 574s on main (run 34607118047), and
      # 609.87s GREEN here while the 600s cap killed the step at 612s (run
      # 34664677569), taking the sandbox proof below down with it as `skipped`.
      # A step that reports a hung sandbox as a failed suite is the one thing
      # this budget exists to prevent, so it is sized off the measurement with
      # margin, not off runner luck. The durable fix is a faster suite.
      - name: Run the suite with no network access
        timeout-minutes: 15
        run: |
          # Resolved in the outer shell: `sudo` resets PATH, so the inner shell
          # cannot find uv on its own.
          uv_path="$(command -v uv)"

          sudo --preserve-env=UV_CACHE_DIR,UV_PYTHON_INSTALL_DIR \
            unshare --net bash -c "
              ip link set lo up
              echo '--- interfaces visible to the tests ---'
              ip -brief addr
              exec '$uv_path' run --frozen --no-sync pytest -m 'not e2e' -q
            "

      - name: Prove the sandbox actually blocks network
        timeout-minutes: 5
        run: |
          # Without this, a change to the sandboxing could turn the job above
          # into a permanent false pass -- worse than no job, because it would
          # be believed.
          curl_path="$(command -v curl)"

          if sudo unshare --net bash -c "
               ip link set lo up
               '$curl_path' -sS --max-time 5 https://pypi.org >/dev/null
             "; then
            echo "::error::The network namespace did not block outbound traffic."
            exit 1
          fi
          echo "Confirmed: no outbound network inside the sandbox."

  build:
    name: Build and verify the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv build --package theurian
      - name: Install the built wheel into a clean environment
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/theurian version --json
      - name: Publish checksums
        run: |
          cd dist && sha256sum * | tee SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
