name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
      # The build copies assets/theurian-logo.svg into docs/ before running,
      # so the logo is part of the published site without being under docs/.
      - "assets/**"
  workflow_dispatch:

# The floor, as in every other workflow here. The tokens that can publish a
# deployment are granted per job below, so only the job that deploys holds
# them.
permissions:
  contents: read

concurrency:
  group: pages
  # A cancelled deploy leaves the previous deployment live, so the site
  # silently keeps serving an older build. That already happened: the run for
  # the landing page was cancelled mid-flight by the next push, and the site
  # still serves the build from before the landing page existed.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Reads the repository and produces an artifact. It never publishes, so it
    # needs neither id-token: write nor pages: write. It does need pages: read:
    # configure-pages defaults to enablement: false, and on that path it calls
    # GET /repos/{owner}/{repo}/pages and rethrows on failure, failing the job.
    # Read cannot create a deployment, so the split still holds.
    permissions:
      contents: read
      pages: read

    # The mermaid pin, declared once for every step in this job that needs it.
    # mkdocs.yml quotes the same version and hash as documentation for local
    # builds; that copy has to move whenever this one does.
    env:
      MERMAID_VERSION: "11.16.1"
      MERMAID_SHA256: "18327bef70d96fb505fe7287d9f6a7362ebf07ff6576ddfaffb1a06f3e1a2954"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here pushes. Without this the job keeps a credential in
          # .git/config for every later step to reach.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare documentation assets
        run: |
          mkdir -p docs/assets
          cp assets/theurian-logo.svg docs/assets/theurian-logo.svg

      # Fetched at build time and served from our own origin, so no published
      # page references a third-party host. The checksum is what establishes
      # trust, not the transport: on mismatch sha256sum exits non-zero and the
      # job stops before anything is published. --proto/--proto-redir keep -L
      # from being talked down to a plaintext hop.
      #
      # The pin is re-derivable without trusting this commit. npm publishes a
      # SLSA provenance attestation for this exact version at
      # https://registry.npmjs.org/-/npm/v1/attestations/mermaid@11.16.1
      # and the hash in env above is of dist/mermaid.min.js inside that release.
      - name: Fetch the pinned mermaid bundle
        run: |
          mkdir -p docs/js
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 \
            "https://cdn.jsdelivr.net/npm/mermaid@${MERMAID_VERSION}/dist/mermaid.min.js" \
            -o docs/js/mermaid.min.js
          echo "${MERMAID_SHA256}  docs/js/mermaid.min.js" | sha256sum -c -

      - name: Build documentation
        run: mkdocs build --strict --site-dir site

      # A file missing from docs/ is not a build error: MkDocs copies what is
      # there and exits 0, and the page then asks for a bundle that was never
      # fetched. Checking the built site rather than docs/ covers the copy step
      # as well, so what is verified is what actually ships.
      #
      # This guarantees the bundle is present and unaltered in the artifact. It
      # says nothing about whether any diagram parses: a fence that fails to
      # parse is handled at page time by mermaid-init.js, which restores its
      # source text.
      - name: Check the mermaid bundle reached the site intact
        run: echo "${MERMAID_SHA256}  site/js/mermaid.min.js" | sha256sum -c -

      # The same failure shape, for a file nothing in mkdocs.yml names: whether
      # MkDocs copied docs/google150fa28bebf014f3.html into the site is not
      # something the build reports. It is Google's ownership-verification token
      # for the site, and if it stops being served at the site root Google
      # withdraws the verification, with an email as the only signal. cmp rather
      # than test -f because Google matches the file's exact bytes, so a
      # reformatted copy fails verification as surely as a missing one.
      - name: Check the verification token reached the site intact
        run: cmp docs/google150fa28bebf014f3.html site/google150fa28bebf014f3.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    # Publishes the artifact the build job produced. It checks nothing out.
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
