name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
      # The build copies assets/theurian-logo.svg into docs/ before running,
      # so the logo is part of the published site without being under docs/.
      - "assets/**"
  workflow_dispatch:

# The floor, as in every other workflow here. The tokens that can publish a
# deployment are granted per job below, so only the job that deploys holds
# them.
permissions:
  contents: read

concurrency:
  group: pages
  # A cancelled deploy leaves the previous deployment live, so the site
  # silently keeps serving an older build. That already happened: the run for
  # the landing page was cancelled mid-flight by the next push, and the site
  # still serves the build from before the landing page existed.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Reads the repository and produces an artifact. It never publishes, so it
    # needs neither id-token: write nor pages: write. It does need pages: read:
    # configure-pages defaults to enablement: false, and on that path it calls
    # GET /repos/{owner}/{repo}/pages and rethrows on failure, failing the job.
    # Read cannot create a deployment, so the split still holds.
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here pushes. Without this the job keeps a credential in
          # .git/config for every later step to reach.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare documentation assets
        run: |
          mkdir -p docs/assets
          cp assets/theurian-logo.svg docs/assets/theurian-logo.svg

      - name: Build documentation
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    # Publishes the artifact the build job produced. It checks nothing out.
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
