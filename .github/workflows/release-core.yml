name: Release Core

# Cutting a Core release means pushing a signed `core-v*` tag. Core and the
# plugin release independently (ADR-0001), which is why the tag namespace is
# not optional — `release-plugin.yml` will own `plugin-v*`.
#
# This workflow is the executable form of docs/contributing/release.md §5–§6:
# build, verify the artifact in a clean environment, produce an SBOM and
# checksums, publish to PyPI, then cut the GitHub release. Before this file
# existed, release.md claimed "CI builds, verifies, and publishes checksums"
# and nothing did.
on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, publish nothing."
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a release in flight. PyPI refuses a second upload of a filename
# it already holds, so a run cancelled between the two publish steps leaves a
# version that can only be yanked, never repaired.
concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

env:
  # Deliberately the same toolchain core.yml tests with, not the newest. A
  # release resolved by a different uv than CI exercised reaches users before
  # anyone has run the difference.
  UV_VERSION: "0.7.2"
  CYCLONEDX_VERSION: "7.3.1"
  # The release trust root, space separated. A `core-v*` tag is published only
  # if its signature verifies against a public key GitHub holds for one of
  # these accounts — the same keys behind the "Verified" badge on a tag page.
  # Adding an account here grants it the ability to cut a release, so it is a
  # review decision, not a configuration detail.
  RELEASE_SIGNERS: "utchy"

jobs:
  # A tag push does not trigger core.yml — it filters on `branches: [main]`.
  # Without this job, tagging a red commit would publish it.
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check packages tests
      - run: uv run ruff check --output-format=github packages tests
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    name: Build, verify, and sign off the artifacts
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The annotated tag object itself, so the signature check below has
          # something to read.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve the version, and refuse a tag that disagrees with it
        id: resolve
        run: |
          set -euo pipefail
          declared="$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('packages/theurian-core/pyproject.toml').read_text())
          print(data['project']['version'])
          ")"
          if [ "${{ github.event_name }}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#core-v}"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} claims ${tagged}, pyproject.toml declares ${declared}."
              exit 1
            fi
          fi
          echo "version=${declared}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${declared}"

      - name: Require the tag to be signed by a release signer
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What this establishes: the tag object carries a signature that
          # verifies against a public key GitHub holds for one of
          # RELEASE_SIGNERS. What it does not establish: that the tag push was
          # legitimate. A push to refs/tags runs this workflow from the tagged
          # commit, so whoever chooses that commit chooses this file too. The
          # step catches a tag that is unsigned or signed with a key nobody
          # registered; it is not a barrier to anyone who can already push
          # tags, and nothing in this file can be.
          #
          # It replaced a `git cat-file tag | grep '^-----BEGIN'` test, which
          # read the tag *message* as well as the signature and so accepted
          # `git tag -a` with the banner pasted into the message. No
          # syntactic check can separate the two: a tag object appends its
          # signature to the message with no delimiter, so even git's own
          # `%(contents:signature)` extracts the forgery. Verification is the
          # only thing that tells them apart, which is why the probes below
          # run before the verdict on the real tag is believed.
          trust="${RUNNER_TEMP}/release-trust-root"
          rm -rf "$trust"
          install -d -m 700 "$trust"
          signers="${trust}/allowed_signers"
          : > "$signers"

          # Word splitting on RELEASE_SIGNERS is deliberate; it is a list.
          for account in ${RELEASE_SIGNERS}; do
            gh api "users/${account}/gpg_keys" \
               --jq '.[].raw_key | select(. != null)' > "${RUNNER_TEMP}/${account}.asc"
            if [ -s "${RUNNER_TEMP}/${account}.asc" ]; then
              GNUPGHOME="$trust" gpg --batch --quiet --import "${RUNNER_TEMP}/${account}.asc"
            fi
            # `*` as the principal: the key is the identity under test. The
            # tagger line is self-asserted and binds nothing.
            gh api "users/${account}/ssh_signing_keys" --jq '.[] | "* " + .key' >> "$signers"
          done

          openpgp="$(GNUPGHOME="$trust" gpg --list-keys --with-colons 2>/dev/null \
                     | grep -c '^pub:' || true)"
          ssh_keys="$(grep -c . "$signers" || true)"
          echo "Trust root: ${openpgp} OpenPGP and ${ssh_keys} SSH keys for ${RELEASE_SIGNERS}."
          # An empty trust root rejects every tag, including a good one, so the
          # release would fail anyway — but it would fail saying the tag was
          # unsigned, which is a lie about the tag.
          if [ "$((openpgp + ssh_keys))" -eq 0 ]; then
            echo "::error::No public signing keys are registered for ${RELEASE_SIGNERS}."
            exit 1
          fi

          # One code path for the probes and for the release tag. A probe that
          # exercised a different command would prove nothing about this check.
          verify() {  # repo, tag ref, GNUPGHOME, allowed signers file
            GNUPGHOME="$3" git -C "$1" -c gpg.ssh.allowedSignersFile="$4" verify-tag "$2"
          }

          probe="${RUNNER_TEMP}/signature-guard-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          git -C "$probe" init -q -b main
          git -C "$probe" config user.name 'signature guard probe'
          git -C "$probe" config user.email 'probe@invalid'
          git -C "$probe" commit -q --allow-empty -m probe
          printf 'release 9.9.9\n\n-----BEGIN PGP SIGNATURE-----\nnot a signature\n-----END PGP SIGNATURE-----\n' \
            > "${probe}/pgp-banner.txt"
          printf 'release 9.9.8\n\n-----BEGIN SSH SIGNATURE-----\nU1NIU0lHAAAAAWZha2U=\n-----END SSH SIGNATURE-----\n' \
            > "${probe}/ssh-banner.txt"
          git -C "$probe" tag -a probe-pgp-banner -F "${probe}/pgp-banner.txt"
          git -C "$probe" tag -a probe-ssh-banner -F "${probe}/ssh-banner.txt"
          git -C "$probe" tag -a probe-unsigned -m 'no signature at all'
          git -C "$probe" tag probe-lightweight
          for probe_tag in probe-pgp-banner probe-ssh-banner probe-unsigned probe-lightweight; do
            if verify "$probe" "refs/tags/${probe_tag}" "$trust" "$signers" >/dev/null 2>&1; then
              echo "::error::The guard accepted ${probe_tag}, which carries no signature."
              exit 1
            fi
          done

          # A guard that rejected everything would pass all four probes, so it
          # also has to say yes to something: the same function, against a
          # trust root holding a throwaway key, on a tag genuinely signed by it.
          ssh-keygen -q -t ed25519 -N '' -C probe -f "${probe}/key"
          printf '* %s\n' "$(cat "${probe}/key.pub")" > "${probe}/probe_signers"
          git -C "$probe" -c gpg.format=ssh -c user.signingkey="${probe}/key.pub" \
              tag -s probe-signed -m 'genuinely signed'
          if ! verify "$probe" refs/tags/probe-signed "$trust" "${probe}/probe_signers"; then
            echo "::error::The guard rejected a genuinely signed tag; its verdict means nothing."
            exit 1
          fi
          echo "Guard checked: rejects four unsigned tags, accepts a signed one."

          # git's own output above this line says which of the three it was:
          # no signature, a signature from a key outside the trust root, or no
          # annotated tag object at all.
          if ! verify . "refs/tags/${GITHUB_REF_NAME}" "$trust" "$signers"; then
            echo "::error::${GITHUB_REF_NAME} did not verify against ${RELEASE_SIGNERS}. Re-tag with 'git tag -s' using a key registered on that GitHub account (release.md §4)."
            exit 1
          fi

      - name: Require a changelog section written for this version
        run: |
          set -euo pipefail
          python3 - "${{ steps.resolve.outputs.version }}" <<'PY' > release-notes.md
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("packages/theurian-core/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(
                  f"CHANGELOG.md has no '## [{version}]' section. "
                  "Move [Unreleased] under the version before tagging (release.md §2)."
              )
          body = match.group(1).strip()
          if not body:
              sys.exit(f"The CHANGELOG section for {version} is empty.")
          print(body)
          PY
          echo "--- release notes ---"
          cat release-notes.md

      - run: uv build --package theurian

      - name: Install the built wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/theurian version --json

      - name: Refuse a wheel whose runtime version disagrees with the release
        run: |
          set -euo pipefail
          expected="${{ steps.resolve.outputs.version }}"
          reported="$(/tmp/verify/bin/theurian version --json \
                      | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          # pyproject.toml and theurian.__version__ are two separate literals.
          # This is the check that keeps release.md's "pyproject.toml and
          # __version__ agree" from being a thing someone remembers to do.
          if [ "$reported" != "$expected" ]; then
            echo "::error::The installed package reports ${reported}; releasing ${expected}."
            exit 1
          fi
          if ! ls dist/ | grep -q -- "-${expected}-\|-${expected}\.tar\.gz"; then
            echo "::error::No artifact in dist/ carries version ${expected}."
            exit 1
          fi

      - name: Build the CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          # Taken from the verified environment rather than from the lock file,
          # so the SBOM describes what a user actually installs.
          # --output-reproducible drops timestamps and serial numbers, so
          # rebuilding the same release produces a byte-identical SBOM.
          uvx --from "cyclonedx-bom==${CYCLONEDX_VERSION}" cyclonedx-py environment \
              /tmp/verify/bin/python \
              --pyproject packages/theurian-core/pyproject.toml \
              --of JSON --sv 1.6 --output-reproducible --validate \
              -o "dist/theurian-${version}.cdx.json"

      - name: Publish checksums
        run: |
          set -euo pipefail
          # `uv build` leaves a .gitignore in dist/; it is not a release artifact.
          rm -f dist/.gitignore
          cd dist && sha256sum * | tee SHA256SUMS
          # Covers the wheel, the sdist, and the SBOM. Publishing this file is
          # the half of T-16 that ships; nothing verifies it at install time.
          # `probe_artifact_integrity` returns not-applicable unconditionally, so
          # a consumer of SHA256SUMS is a human until that changes.

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/theurian/${{ needs.build.outputs.version }}
    permissions:
      # Trusted Publishing (OIDC). No long-lived PyPI token exists in this
      # repository's secrets, so there is none to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Separate the distributions from the release-only files
        run: |
          set -euo pipefail
          mkdir -p upload
          cp artifacts/dist/*.whl artifacts/dist/*.tar.gz upload/
          # SHA256SUMS and the SBOM belong on the GitHub release, not in a
          # PyPI upload — twine rejects anything that is not a distribution.
          ls -la upload

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: upload
          # PEP 740 attestations, signed by this workflow's OIDC identity.
          attestations: true
          print-hash: true

  github-release:
    name: Cut the GitHub release
    needs: [build, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          {
            cat artifacts/release-notes.md
            echo
            echo "---"
            echo
            echo "Install: \`uv tool install theurian==${VERSION}\`"
            echo
            echo "Every artifact below is covered by \`SHA256SUMS\`, and"
            echo "\`theurian-${VERSION}.cdx.json\` is its CycloneDX 1.6 SBOM."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Theurian Core ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/dist/*
