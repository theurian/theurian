name: Release Core

# Cutting a Core release means pushing a signed `core-v*` tag. Core and the
# plugin release independently (ADR-0001), which is why the tag namespace is
# not optional — `release-plugin.yml` will own `plugin-v*`.
#
# This workflow is the executable form of docs/contributing/release.md §5–§6:
# build, verify the artifact in a clean environment, produce an SBOM and
# checksums, draft the GitHub release that carries them, publish to PyPI, then
# take that release out of draft. Before this file existed, release.md claimed
# "CI builds, verifies, and publishes checksums" and nothing did.
#
# The release is drafted before the upload and published after it, so no job
# failing or being cancelled leaves a wheel installable from PyPI while the
# checksums a verifier would check it against exist nowhere. Publishing that
# record is the half of T-16 that ships; this ordering is what makes it survive
# a failure.
#
# Two things that claim does not cover, both stated rather than glossed:
#
#   * Between a successful upload and a successful `publish-release` the wheel
#     is installable while the draft holding its checksums is readable only
#     with push access. T-16's beneficiary is the installing user, so that
#     window is real; it is bounded by one job.
#   * Deleting the draft and then re-running only the *failed* jobs reaches the
#     bad state: `draft-release` is not re-run, so `publish-release` still
#     carries the id of the release that was deleted, and the upload succeeds
#     with nothing left to publish. This was measured; it is not hypothetical,
#     and the run need not be in flight. **After deleting a draft, re-run all
#     jobs.** release.md §5 gives the rule per failure.
#
# Argued in full in docs/contributing/release.md §5.
on:
  push:
    tags: ["core-v*"]
  # The rehearsal path, and it publishes nothing. `quality` runs in full and
  # `build` runs all but its tag-signature step — the changelog guard, the
  # build, installing the wheel into a clean environment and checking that it
  # reports pyproject.toml's version, the SBOM, SHA256SUMS — and then the run
  # stops, because all three publication jobs below are
  # `if: github.event_name == 'push'`.
  #
  # Two checks it cannot exercise, both because they read a tag that a manual
  # run does not have: `core-v<version>` agreeing with pyproject.toml, and the
  # signature guard. Nor does it exercise the three publication jobs at all. A
  # green rehearsal is evidence about the build — not about the tag, and not
  # about anything downstream of `build`.
  #
  # There is no input to set. A `dry_run` boolean lived here and was wired to
  # nothing: the jobs below were skipped by the `if`, never by the flag, so
  # setting it to false published nothing either. A control that controls
  # nothing is worse than no control, because runs get reported as governed
  # by it.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release in flight. PyPI refuses a second upload of a filename
# it already holds, so a run cancelled during or after the upload leaves a
# version that can only be yanked, never repaired. What a cancellation no longer
# costs is the record: the draft release created before the upload already holds
# that version's checksums and SBOM, so publishing it takes one command and no
# rebuild.
concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

env:
  # Deliberately the same toolchain core.yml tests with, not the newest. A
  # release resolved by a different uv than CI exercised reaches users before
  # anyone has run the difference.
  UV_VERSION: "0.7.2"
  CYCLONEDX_VERSION: "7.3.1"
  # The release trust root, space separated. A `core-v*` tag is published only
  # if its signature verifies against a public key GitHub holds for one of
  # these accounts — the same keys behind the "Verified" badge on a tag page.
  # Adding an account here grants it the ability to cut a release, so it is a
  # review decision, not a configuration detail.
  RELEASE_SIGNERS: "utchy"

jobs:
  # A tag push does not trigger core.yml — it filters on `branches: [main]`.
  # Without this job, tagging a red commit would publish it.
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check packages tests
      - run: uv run ruff check --output-format=github packages tests
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    name: Build, verify, and sign off the artifacts
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The annotated tag object itself, so the signature check below has
          # something to read.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve the version, and refuse a tag that disagrees with it
        id: resolve
        run: |
          set -euo pipefail
          declared="$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('packages/theurian-core/pyproject.toml').read_text())
          print(data['project']['version'])
          ")"
          if [ "${{ github.event_name }}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#core-v}"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} claims ${tagged}, pyproject.toml declares ${declared}."
              exit 1
            fi
          fi
          echo "version=${declared}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${declared}"

      - name: Require the tag to be signed by a release signer
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What this establishes: the tag object carries a signature that
          # verifies against a public key GitHub holds for one of
          # RELEASE_SIGNERS. What it does not establish: that the tag push was
          # legitimate. A push to refs/tags runs this workflow from the tagged
          # commit, so whoever chooses that commit chooses this file too. The
          # step catches a tag that is unsigned or signed with a key nobody
          # registered; it is not a barrier to anyone who can already push
          # tags, and nothing in this file can be.
          #
          # It replaced a `git cat-file tag | grep '^-----BEGIN'` test, which
          # read the tag *message* as well as the signature and so accepted
          # `git tag -a` with the banner pasted into the message. No
          # syntactic check can separate the two: a tag object appends its
          # signature to the message with no delimiter, so even git's own
          # `%(contents:signature)` extracts the forgery. Verification is the
          # only thing that tells them apart, which is why the probes below
          # run before the verdict on the real tag is believed.
          trust="${RUNNER_TEMP}/release-trust-root"
          rm -rf "$trust"
          install -d -m 700 "$trust"
          signers="${trust}/allowed_signers"
          : > "$signers"

          # Word splitting on RELEASE_SIGNERS is deliberate; it is a list.
          for account in ${RELEASE_SIGNERS}; do
            gh api "users/${account}/gpg_keys" \
               --jq '.[].raw_key | select(. != null)' > "${RUNNER_TEMP}/${account}.asc"
            if [ -s "${RUNNER_TEMP}/${account}.asc" ]; then
              GNUPGHOME="$trust" gpg --batch --quiet --import "${RUNNER_TEMP}/${account}.asc"
            fi
            # `*` as the principal: the key is the identity under test. The
            # tagger line is self-asserted and binds nothing.
            gh api "users/${account}/ssh_signing_keys" --jq '.[] | "* " + .key' >> "$signers"
          done

          openpgp="$(GNUPGHOME="$trust" gpg --list-keys --with-colons 2>/dev/null \
                     | grep -c '^pub:' || true)"
          ssh_keys="$(grep -c . "$signers" || true)"
          echo "Trust root: ${openpgp} OpenPGP and ${ssh_keys} SSH keys for ${RELEASE_SIGNERS}."
          # An empty trust root rejects every tag, including a good one, so the
          # release would fail anyway — but it would fail saying the tag was
          # unsigned, which is a lie about the tag.
          if [ "$((openpgp + ssh_keys))" -eq 0 ]; then
            echo "::error::No public signing keys are registered for ${RELEASE_SIGNERS}."
            exit 1
          fi

          # One code path for the probes and for the release tag. A probe that
          # exercised a different command would prove nothing about this check.
          verify() {  # repo, tag ref, GNUPGHOME, allowed signers file
            GNUPGHOME="$3" git -C "$1" -c gpg.ssh.allowedSignersFile="$4" verify-tag "$2"
          }

          probe="${RUNNER_TEMP}/signature-guard-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          git -C "$probe" init -q -b main
          git -C "$probe" config user.name 'signature guard probe'
          git -C "$probe" config user.email 'probe@invalid'
          git -C "$probe" commit -q --allow-empty -m probe
          printf 'release 9.9.9\n\n-----BEGIN PGP SIGNATURE-----\nnot a signature\n-----END PGP SIGNATURE-----\n' \
            > "${probe}/pgp-banner.txt"
          printf 'release 9.9.8\n\n-----BEGIN SSH SIGNATURE-----\nU1NIU0lHAAAAAWZha2U=\n-----END SSH SIGNATURE-----\n' \
            > "${probe}/ssh-banner.txt"
          git -C "$probe" tag -a probe-pgp-banner -F "${probe}/pgp-banner.txt"
          git -C "$probe" tag -a probe-ssh-banner -F "${probe}/ssh-banner.txt"
          git -C "$probe" tag -a probe-unsigned -m 'no signature at all'
          git -C "$probe" tag probe-lightweight
          for probe_tag in probe-pgp-banner probe-ssh-banner probe-unsigned probe-lightweight; do
            if verify "$probe" "refs/tags/${probe_tag}" "$trust" "$signers" >/dev/null 2>&1; then
              echo "::error::The guard accepted ${probe_tag}, which carries no signature."
              exit 1
            fi
          done

          # A guard that rejected everything would pass all four probes, so it
          # also has to say yes to something: the same function, against a
          # trust root holding a throwaway key, on a tag genuinely signed by it.
          ssh-keygen -q -t ed25519 -N '' -C probe -f "${probe}/key"
          printf '* %s\n' "$(cat "${probe}/key.pub")" > "${probe}/probe_signers"
          git -C "$probe" -c gpg.format=ssh -c user.signingkey="${probe}/key.pub" \
              tag -s probe-signed -m 'genuinely signed'
          if ! verify "$probe" refs/tags/probe-signed "$trust" "${probe}/probe_signers"; then
            echo "::error::The guard rejected a genuinely signed tag; its verdict means nothing."
            exit 1
          fi
          echo "Guard checked: rejects four unsigned tags, accepts a signed one."

          # git's own output above this line says which of the three it was:
          # no signature, a signature from a key outside the trust root, or no
          # annotated tag object at all.
          if ! verify . "refs/tags/${GITHUB_REF_NAME}" "$trust" "$signers"; then
            echo "::error::${GITHUB_REF_NAME} did not verify against ${RELEASE_SIGNERS}. Re-tag with 'git tag -s' using a key registered on that GitHub account (release.md §4)."
            exit 1
          fi

      - name: Require a changelog section written for this version
        run: |
          set -euo pipefail
          python3 - "${{ steps.resolve.outputs.version }}" <<'PY' > release-notes.md
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("packages/theurian-core/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(
                  f"CHANGELOG.md has no '## [{version}]' section. "
                  "Move [Unreleased] under the version before tagging (release.md §2)."
              )
          body = match.group(1).strip()
          if not body:
              sys.exit(f"The CHANGELOG section for {version} is empty.")
          print(body)
          PY
          echo "--- release notes ---"
          cat release-notes.md

      - run: uv build --package theurian

      - name: Install the built wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/theurian version --json

      - name: Refuse a wheel whose runtime version disagrees with the release
        run: |
          set -euo pipefail
          expected="${{ steps.resolve.outputs.version }}"
          reported="$(/tmp/verify/bin/theurian version --json \
                      | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          # pyproject.toml and theurian.__version__ are two separate literals.
          # This is the check that keeps release.md's "pyproject.toml and
          # __version__ agree" from being a thing someone remembers to do.
          if [ "$reported" != "$expected" ]; then
            echo "::error::The installed package reports ${reported}; releasing ${expected}."
            exit 1
          fi
          if ! ls dist/ | grep -q -- "-${expected}-\|-${expected}\.tar\.gz"; then
            echo "::error::No artifact in dist/ carries version ${expected}."
            exit 1
          fi

      - name: Build the CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          # Taken from the verified environment rather than from the lock file,
          # so the SBOM describes what a user actually installs.
          # --output-reproducible drops timestamps and serial numbers, so
          # rebuilding the same release produces a byte-identical SBOM.
          uvx --from "cyclonedx-bom==${CYCLONEDX_VERSION}" cyclonedx-py environment \
              /tmp/verify/bin/python \
              --pyproject packages/theurian-core/pyproject.toml \
              --of JSON --sv 1.6 --output-reproducible --validate \
              -o "dist/theurian-${version}.cdx.json"

      - name: Publish checksums
        run: |
          set -euo pipefail
          # `uv build` leaves a .gitignore in dist/; it is not a release artifact.
          rm -f dist/.gitignore
          cd dist && sha256sum * | tee SHA256SUMS
          # Covers the wheel, the sdist, and the SBOM. Publishing this file is
          # the half of T-16 that ships; nothing verifies it at install time.
          # `probe_artifact_integrity` returns not-applicable unconditionally, so
          # a consumer of SHA256SUMS is a human until that changes.

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # The record, before the artifact it describes is reachable.
  #
  # `SHA256SUMS` and the SBOM are what a verifier checks a download against, and
  # until this job runs they exist only inside the workflow run, which expires.
  # Creating the release here means no failure after this point can leave an
  # installable wheel with no record of its checksums anywhere: PyPI refuses a
  # second upload of a filename it already holds, so an upload that succeeds
  # cannot be undone by retrying, only yanked.
  #
  # It is a *draft*, which is visible only to accounts with push access, so the
  # release becomes public in `publish-release` and not before — the record is
  # written first, announced last.
  #
  # If this job fails partway it leaves a draft holding some of the assets and
  # nothing on PyPI, because `publish-pypi` waits on it. `gh` does not clean that
  # up: `cleanupDraftRelease` returns early when `--draft` was requested, by
  # design. Delete the draft and re-run. That is safe precisely because nothing
  # has been published yet, which is the property the whole ordering exists to
  # buy — and the first step below refuses to run until it has been done, rather
  # than trusting anyone to remember.
  #
  # This job reaches `contents: write` before the `pypi` environment's required
  # reviewer sees anything, which the old order did not. What that grants is
  # bounded: a draft release for the pushed tag, not public. Reaching here at
  # all needs a tag whose signature verified against RELEASE_SIGNERS, and an
  # actor who can defeat that check is choosing the commit this file is read
  # from, so they could grant themselves `contents: write` regardless. A
  # rejected or never-approved deployment leaves the draft behind; delete it.
  draft-release:
    name: Draft the GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The identity of the release this run created. `publish-release` flips
      # *this* object, never whatever a tag name happens to resolve to.
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      # Pinned by digest rather than by the mutable `v8`: this is the first
      # third-party code to run in a job holding `contents: write`, and it runs
      # before the required reviewer has seen anything. `v8` is a lightweight
      # tag the upstream repository can move. (Nothing else in this repository
      # is digest-pinned yet; that is a larger change than this PR.)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: artifacts

      # `gh release create --draft` does NOT refuse a tag that already has a
      # release. Its duplicate check is guarded by `hasAssets && !opts.Draft`,
      # and the helper behind it, `publishedReleaseExists`, issues
      # `HEAD /releases/tags/{tag}`, which does not return drafts. So two drafts
      # can share one tag, and `gh release edit <tag>` then resolves through
      # `FetchRelease`, which races a REST lookup against a GraphQL
      # `repository.release(tagName:)` — measured to return the *oldest* draft,
      # 4 times out of 4.
      #
      # That was reproduced end to end on GitHub Actions, in a scratch
      # repository. `draft-release` fails after attaching one asset; a
      # maintainer clicks GitHub's own "Re-run failed jobs"; the second attempt
      # creates a complete draft; and `publish-release` publishes the *first*,
      # incomplete one. **Every job reports success.** The published release
      # then describes a different build than the wheel on PyPI, under a body
      # claiming every artifact is covered by its SHA256SUMS. No attacker, no
      # error message, nothing to notice.
      #
      # The old order self-healed here, and this is the one respect in which it
      # was better: `gh release create` *without* `--draft` does refuse a
      # duplicate tag, so a re-run failed loudly. Drafting first gives that up,
      # and this guard is what buys it back.
      #
      # This guard matches on the tag alone, NOT on `.draft`. An earlier version
      # counted only drafts, and that let the workflow walk into exactly the
      # state it exists to prevent: publish the draft by hand, press "Re-run all
      # jobs", and the guard sees no draft, so the upload proceeds and the
      # publish step then fails with HTTP 422 — the REST API refusing a second
      # *published* release on one tag. That 422 is a real backstop, and it
      # fires after the irreversible step. Matching every release moves it
      # before.
      #
      # This is an assertion, not a recovery branch. It only ever fails.
      - name: Refuse to draft when this tag already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One line per release on this tag, draft or not. `--paginate`
          # concatenates per-page output, so counting lines is correct where
          # summing lengths is not.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                      --jq '.[] | select(.tag_name == env.TAG) | "\(.id) (draft=\(.draft))"')"
          if [ -n "$existing" ]; then
            # Delete by id. `gh release delete <tag>` resolves through the same
            # racing lookup and has been measured to delete the *published*
            # release while leaving the draft — the exact inverse of intent.
            echo "::error::${TAG} already has a release: $(echo $existing). Publishing would pick one of them, and not necessarily this run's. If it is a draft nothing was published; delete it by id and re-run ALL jobs (a re-run of only the failed ones keeps the deleted id): gh api -X DELETE repos/${GITHUB_REPOSITORY}/releases/<id>"
            exit 1
          fi
          echo "No release exists for ${TAG}."

      - name: Create the release as a draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            cat artifacts/release-notes.md
            echo
            echo "---"
            echo
            echo "Install: \`uv tool install theurian==${VERSION}\`"
            echo
            echo "Every artifact below is covered by \`SHA256SUMS\`, and"
            echo "\`theurian-${VERSION}.cdx.json\` is its CycloneDX 1.6 SBOM."
          } > notes.md

          # `gh release create` is not used here, because it returns a URL and
          # not an id -- so the id had to be read back from `GET /releases`,
          # which is eventually consistent (a release created at 12:38:09 was
          # measured absent one second later). Reading it back also cannot tell
          # *our* draft from someone else's on the same tag; it could only
          # assume, and the assumption rested on the same lagging list.
          #
          # POST returns the authoritative id synchronously. No retry, no
          # assumption, no window.
          #
          # `--verify-tag` goes with `gh release create`, so the check it
          # performed is done explicitly first: refuse if the tag is not really
          # in the repository.
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent

          # The body is built with jq rather than with `gh -F key=@file`, so the
          # notes are unambiguously a JSON string and nothing type-infers them.
          created="$(jq -n --arg tag "$TAG" \
                           --arg name "Theurian Core ${VERSION}" \
                           --rawfile body notes.md \
                           '{tag_name: $tag, name: $name, body: $body, draft: true}' \
                     | gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" --input -)"
          release_id="$(printf '%s' "$created" | jq -r '.id')"
          upload_url="$(printf '%s' "$created" | jq -r '.upload_url' | sed 's/{?name,label}$//')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::Creating the draft returned no id. Nothing was published."
            exit 1
          fi
          echo "Created draft release ${release_id} for ${TAG}."

          # Assets go to the URL that creation returned, so they land on that
          # release and no lookup happens. Any failure here fails the job, and
          # `publish-pypi` waits on it, so nothing reaches PyPI.
          for asset in artifacts/dist/*; do
            name="$(basename "$asset")"
            code="$(curl -sS -o /tmp/upload-body.json -w '%{http_code}' \
                      -X POST "${upload_url}?name=${name}" \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Content-Type: application/octet-stream" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      --data-binary @"$asset")"
            if [ "$code" != "201" ]; then
              echo "::error::Uploading ${name} returned HTTP ${code}: $(cat /tmp/upload-body.json)"
              exit 1
            fi
            echo "Uploaded ${name}"
          done

          # Read the release back by id and confirm it carries every artifact,
          # so a partial upload cannot reach the reviewer looking whole.
          have="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                  --jq '[.assets[].name] | sort | join(" ")')"
          want="$(ls artifacts/dist | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$have" != "$want" ]; then
            echo "::error::Draft ${release_id} carries [${have}] but should carry [${want}]. Nothing was published; delete it by id and re-run all jobs."
            exit 1
          fi

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Drafted ${TAG} as release ${release_id}; not public until publish-release."

  publish-pypi:
    name: Publish to PyPI
    # `draft-release` is a hard prerequisite, not a convenience: it is what
    # makes the checksums exist before the artifact they cover is installable.
    needs: [build, draft-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # This environment carries `core-maintainers` as a required reviewer, so the
    # run stops here and waits for a human. It stops *after* the draft exists,
    # which is the point of the ordering: the maintainer approving an upload can
    # read the release notes, SHA256SUMS and the SBOM they are approving instead
    # of approving a job name.
    environment:
      name: pypi
      url: https://pypi.org/project/theurian/${{ needs.build.outputs.version }}
    permissions:
      # Trusted Publishing (OIDC). No long-lived PyPI token exists in this
      # repository's secrets, so there is none to leak or rotate.
      id-token: write
    steps:
      # Digest-pinned for the same reason as in `draft-release`: this job holds
      # `id-token: write`, which mints the credential PyPI trusts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Separate the distributions from the release-only files
        run: |
          set -euo pipefail
          mkdir -p upload
          cp artifacts/dist/*.whl artifacts/dist/*.tar.gz upload/
          # SHA256SUMS and the SBOM belong on the GitHub release, not in a
          # PyPI upload — twine rejects anything that is not a distribution.
          ls -la upload

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: upload
          # PEP 740 attestations, signed by this workflow's OIDC identity.
          attestations: true
          print-hash: true

  # The artifact is reachable; make the record public. This job uploads nothing
  # and rewrites nothing: it PATCHes `draft` on one release, addressed by the
  # numeric id `draft-release` emitted. That is what makes "what becomes visible
  # is what was attached before the upload" structural rather than asserted — a
  # tag name is a lookup that can resolve to something else, an id is the object.
  #
  # If this job fails, PyPI holds the version and the draft still holds its
  # checksums and SBOM. Re-run it; nothing needs rebuilding and nothing needs
  # yanking. To finish it by hand, publish that id rather than the tag:
  #   gh api -X PATCH repos/<owner>/<repo>/releases/<id> -F draft=false
  # The id is in this job's log and in `draft-release`'s.
  #
  # A 404 on that id means the draft was deleted after `draft-release` recorded
  # it — most often by deleting it and then re-running only the *failed* jobs,
  # which does not re-run `draft-release` and so keeps the dead id. The run need
  # not have been in flight. The wheel is then on PyPI with no release to
  # publish, and the checksums survive only as this run's expiring artifact:
  # download it and cut the release by hand before it expires. After deleting a
  # draft, re-run all jobs, not the failed ones.
  publish-release:
    name: Publish the GitHub release
    # `draft-release` is in `needs` for its output, not only for ordering.
    needs: [build, draft-release, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
          # Index syntax, not `needs.draft-release.outputs...`: in an expression
          # `-` is also the subtraction operator, and this form cannot be read
          # that way. Correct regardless of how the dotted form lexes.
          RELEASE_ID: ${{ needs['draft-release'].outputs.release_id }}
        run: |
          set -euo pipefail
          # Fail closed. If the id did not arrive for any reason, stop -- do not
          # fall back to resolving the tag, which is the defect this replaced.
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::draft-release published no release id; refusing to guess from the tag."
            exit 1
          fi
          # Publishing is irreversible in the sense that matters: the release
          # becomes the public record for this version. Check that the object
          # still is what draft-release left, and that it actually carries the
          # checksums its own body claims cover every artifact.
          verdict="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '
            if .tag_name != env.TAG then "it is tagged \(.tag_name), not \(env.TAG)"
            elif .draft != true then "it is already published"
            elif ([.assets[].name] | index("SHA256SUMS")) == null then "it carries no SHA256SUMS asset"
            else "ok" end')"
          if [ "$verdict" != "ok" ]; then
            echo "::error::Refusing to publish release ${RELEASE_ID}: ${verdict}."
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false --silent
          echo "Theurian Core ${VERSION}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
