name: Shared contract

# Changes to schemas or to both trees run the full cross-artifact suite (§29).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.filter.outputs.core }}
      plugin: ${{ steps.filter.outputs.plugin }}
      schemas: ${{ steps.filter.outputs.schemas }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'packages/theurian-core/**'
            plugin:
              - 'plugins/**'
            schemas:
              - 'schemas/**'
            docs:
              # The link checker below walks every `*.md` in the repository bar
              # the frozen corpus under `.theurian/knowledge/` -- the job says
              # why it skips those -- so the filter that decides whether it
              # runs has to watch every one too. `docs/**` plus a root-level
              # `*.md` left 35 of 88 Markdown files unwatched,
              # `packages/theurian-core/CHANGELOG.md` among them: a change
              # confined to one of those never ran the check.
              #
              # The filter stays wider than the checker's population on
              # purpose. Editing a corpus body runs a job that then skips it,
              # which costs one run and nothing else, whereas narrowing the
              # filter to match would put the exclusion in two places that have
              # to be kept in step by hand.
              #
              # `docs/**` is redundant today -- every tracked file under `docs/`
              # is Markdown, so it selects nothing `**/*.md` does not. It is kept
              # for the case where one is not: moving a non-Markdown file there
              # breaks the links pointing at it.
              #
              # This file lists itself for the same reason `core.yml` does: the
              # checker lives here, so a change to it has to run it.
              #
              # Two things are still uncovered, and they are different failures.
              #
              # Filter reach. Counting distinct existing relative targets that
              # the checker's inline-link regex reaches and none of the three
              # patterns below match: 16 -- 13 tracked files and 3 directories,
              # across 20 links. Among them `release-core.yml` (3 referrers),
              # `setup_steps.py`, five `*.schema.json`, `LICENSE`, `NOTICE` and
              # `CODEOWNERS`. Renaming one breaks a link without running this
              # job.
              #
              # Parser reach. The checker matches inline `[](...)` only, so the
              # five relative links `README.md` writes in HTML are invisible to
              # it whether or not this job fires. `assets/theurian-logo.png` is
              # the one that matters: tracked, matched by no pattern below, and
              # referenced by no inline link anywhere -- so the front-page logo
              # is unprotected in both dimensions at once. Tracked in #62, which
              # also records why extending the regex naively turns this job
              # permanently red.
              #
              # Every count above is stated with the key it was counted under,
              # because each is answerable several ways: 16 distinct targets,
              # 13 if directories are excluded, 20 if links are counted instead.
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/shared.yml'

  schemas:
    name: Schemas are valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.schemas == 'true' || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.2"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/theurian-core/tests/unit/test_schemas.py -v

  compatibility:
    name: Cross-artifact compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # A schema change touches the shared contract, so both consumers are
    # re-checked even if only one tree changed.
    if: |
      needs.changes.outputs.schemas == 'true' ||
      (needs.changes.outputs.core == 'true' && needs.changes.outputs.plugin == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.2"
          enable-cache: true
      - run: uv sync --frozen
      - name: Contract tests against the installed CLI
        run: uv run pytest -m contract -v
      - name: The plugin is compatible with the Core beside it
        run: |
          uv run pytest \
            packages/theurian-core/tests/unit/test_plugin_boundary.py \
            -k compatib -v
      - name: The declared range accepts this Core
        run: |
          uv run theurian compat check \
            --plugin-version "$(yq -r .pluginVersion plugins/claude-code/compatibility.yaml)" \
            --core-minimum "$(yq -r .coreCompatibility.minimum plugins/claude-code/compatibility.yaml)" \
            --core-maximum-exclusive "$(yq -r .coreCompatibility.maximumExclusive plugins/claude-code/compatibility.yaml)" \
            --protocol-version "$(yq -r .protocolVersion plugins/claude-code/compatibility.yaml)" \
            --json

  commits:
    name: Conventional Commits and DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Subjects follow Conventional Commits
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=50
          pattern='^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\([a-z-]+\))?!?: .+'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list "$base..HEAD" --no-merges)
          exit $failed
      - name: Every commit is signed off (DCO)
        run: |
          base="origin/${{ github.base_ref }}"
          failed=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Missing DCO sign-off: $(git log -1 --format=%s "$sha")"
              echo "Fix the latest commit with: git commit --amend -s"
              echo "Fix a branch with: git rebase --signoff ${{ github.base_ref }}"
              failed=1
            fi
          done < <(git rev-list "$base..HEAD" --no-merges)
          exit $failed

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Relative links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          from urllib.parse import urlparse

          root = pathlib.Path(".")
          link = re.compile(r"\[[^\]]*\]\(([^)]+)\)")

          # This repository dogfoods Theurian, so `.theurian/knowledge/` at the
          # top of the tree holds its own corpus: verbatim, byte-frozen
          # snapshots of documents that live under `docs/`, each pinned by a
          # contentSha256 and by a source anchor naming the file and the commit
          # it was taken from (all 26 at 2a98d4c). Their relative links were
          # resolved at that source location -- `../security/threat-model.md`
          # from `docs/work-logs/`, `0024-a-purge-is-a-build.md` from
          # `docs/adr/` -- and resolve from nowhere else. Checking them here
          # re-checks a document that no longer lives here: 54 relative links,
          # all 54 reported broken, and not one of them a broken link in
          # anything this repository publishes.
          #
          # The body is the wrong thing to edit. It is pinned verbatim, so
          # rewriting a link to suit this walk breaks the hash that makes it a
          # snapshot. The population is what has to change.
          #
          # Nothing goes unchecked for it. Each of the 26 bodies records a
          # source `filePath` that is still tracked and still walked below
          # (26/26, measured 2026-08-20), so every one of those links is still
          # checked -- once, at the location where it means something.
          #
          # Anchored at the top of the tree, so the sample corpus under
          # `examples/sample-project/.theurian/knowledge/` stays in: 3 Markdown
          # files, 0 relative links, 0 broken (measured 2026-08-20). Only
          # Markdown is read here, so the sibling `.theurian/migrations/`
          # (YAML) and `.theurian/proposals/` (JSON) were never in this walk
          # and are not named below.
          corpus = (".theurian", "knowledge")

          broken = []
          for md in root.rglob("*.md"):
              if ".venv" in md.parts or ".git" in md.parts:
                  continue
              if md.parts[:2] == corpus:
                  continue
              for target in link.findall(md.read_text(encoding="utf-8")):
                  target = target.split(" ")[0]
                  if urlparse(target).scheme or target.startswith("#"):
                      continue
                  resolved = (md.parent / target.split("#")[0]).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: {target}")
          if broken:
              print("::error::Broken relative links:")
              for b in broken:
                  print(f"  {b}")
              sys.exit(1)
          print("All relative links resolve.")
          PY
