apiVersion: theurian.dev/v1
projectId: sample-order-service
defaultBranch: main
knowledgeDirectory: .theurian

# Every provider defaults to a deterministic in-tree implementation. This project
# works with no API key and no network (ADR-0009).
providers:
  embedding:
    adapter: deterministic-hash
  summarization:
    adapter: extractive
  reranking:
    adapter: identity
  vectorStore:
    adapter: sqlite-vec
  review:
    adapter: none
    # The allowlist review ingestion will read (SEC-10). Nothing in `src/` reads
    # this file, so the allowlist is not in force; review ingestion is owed with
    # Milestone 7 (#129).
    repositories:
      - acme/order-service

retrieval:
  defaultTokenBudget: 8000
  # Approved only, so an unreviewed draft is never returned as a team decision.
  includeStatuses: [approved]

raptor:
  # Off, so a first build is the cheap one. `theurian index build --raptor`
  # turns the forest on for a single build (ADR-0008 decision 10).
  enabled: false
  maxLevels: 3
  minChildrenPerSummary: 3

traceabilityPolicy:
  domain-behavior:
    specification: required
    test: required
    review: required
  architecture:
    adr: required
    review: required
  bug-fix:
    issue: required
    regressionTest: required
  refactoring:
    specification: optional
    behaviorPreservationEvidence: required
  formatting:
    traceability: none

security:
  # The policy the SEC-11 scanner would apply. Nothing in `src/` reads this file
  # and no content secret scanner exists, so this blocks nothing; it is owed with
  # Milestone 7 (#198).
  secretScan: block
  maxSourceFileBytes: 8388608
