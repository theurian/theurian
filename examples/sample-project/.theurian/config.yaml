apiVersion: theurian.dev/v1
projectId: sample-order-service
defaultBranch: main
knowledgeDirectory: .theurian

# Every provider defaults to a deterministic in-tree implementation. This project
# works with no API key and no network (ADR-0009).
providers:
  embedding:
    adapter: deterministic-hash
  summarization:
    adapter: extractive
  reranking:
    adapter: identity
  vectorStore:
    adapter: sqlite-vec
  review:
    adapter: none
    # The allowlist review ingestion will read (SEC-10). This file is read --
    # `security/project_config.py` opens it for `security.secretScan` alone --
    # but nothing in `src/` reads `providers.review.repositories`, so the
    # allowlist is not in force. It is owed with the first external fetch path
    # (#429 owns it; #129 was closed on the wording rather than the control).
    repositories:
      - acme/order-service

retrieval:
  defaultTokenBudget: 8000
  # Approved only, so an unreviewed draft is never returned as a team decision.
  includeStatuses: [approved]

raptor:
  # Off, so a first build is the cheap one. `theurian index build --raptor`
  # turns the forest on for a single build (ADR-0008 decision 10).
  enabled: false
  maxLevels: 3
  minChildrenPerSummary: 3

traceabilityPolicy:
  domain-behavior:
    specification: required
    test: required
    review: required
  architecture:
    adr: required
    review: required
  bug-fix:
    issue: required
    regressionTest: required
  refactoring:
    specification: optional
    behaviorPreservationEvidence: required
  formatting:
    traceability: none

security:
  # In force: what `theurian propose accept` does when a body it would land looks
  # like it holds a secret (SEC-11). `block` refuses the acceptance and consumes
  # nothing, `warn` accepts and reports, `"off"` skips the scan; `block` is also
  # what an absent key selects, so this line states the default rather than
  # changing it. The detector is best effort and covers the approval gate only --
  # `theurian ingest` and index building run no scan (#198).
  #
  # `off` needs the quotes. YAML reads a bare `off` as the boolean false, and the
  # acceptance is refused rather than guessing which policy that meant.
  secretScan: block
  maxSourceFileBytes: 8388608
