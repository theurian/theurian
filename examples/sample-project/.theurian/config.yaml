apiVersion: theurian.dev/v1
projectId: sample-order-service
defaultBranch: main
knowledgeDirectory: .theurian

# Every provider defaults to a deterministic in-tree implementation. This project
# works with no API key and no network (ADR-0009).
providers:
  embedding:
    adapter: deterministic-hash
  summarization:
    adapter: extractive
  reranking:
    adapter: identity
  vectorStore:
    adapter: sqlite-vec
  review:
    adapter: none
    # In force (SEC-10, ADR-0030 decision 2). `security/project_config.py` reads
    # `providers.review.repositories` and `security/review_allowlist.py` refuses
    # a repository this list does not name, before the process that reaches
    # GitHub is started -- an empty or absent list allows nothing. Names are
    # matched case-insensitively, as GitHub resolves them, and a `.` or `..`
    # segment is refused so no value here is a path out of the project. Public
    # repositories only in this version: an allowlisted repository that resolves
    # as private is refused at ingestion (#575 owns private-repository
    # ingestion). No command exposes review ingestion yet, so listing a
    # repository here starts nothing on its own.
    repositories:
      - acme/order-service

retrieval:
  defaultTokenBudget: 8000
  # Approved only, so an unreviewed draft is never returned as a team decision.
  includeStatuses: [approved]

raptor:
  # Off, so a first build is the cheap one. `theurian index build --raptor`
  # turns the forest on for a single build (ADR-0008 decision 10).
  enabled: false
  maxLevels: 3
  minChildrenPerSummary: 3

traceabilityPolicy:
  domain-behavior:
    specification: required
    test: required
    review: required
  architecture:
    adr: required
    review: required
  bug-fix:
    issue: required
    regressionTest: required
  refactoring:
    specification: optional
    behaviorPreservationEvidence: required
  formatting:
    traceability: none

security:
  # In force: what `theurian propose accept` does when a body it would land looks
  # like it holds a secret (SEC-11). `block` refuses the acceptance and consumes
  # nothing, `warn` accepts and reports, `"off"` skips the scan; `block` is also
  # what an absent key selects, so this line states the default rather than
  # changing it. The same key also governs `theurian index build`, where the
  # three values are signal severity and not a gate -- the index is published
  # either way, because by then the content is already served -- so `block`
  # exits non-zero and `theurian doctor` reports it. The detector is best effort
  # and is not a repository secret scanner; `theurian ingest` runs no scan of its
  # own, and a draft-time advisory is still owed (#330 owns it; the `propose
  # accept` half shipped under #198 and the `index build` half under #329, both
  # of which are history here and own nothing).
  #
  # `off` needs the quotes. YAML reads a bare `off` as the boolean false, and the
  # acceptance is refused rather than guessing which policy that meant.
  secretScan: block
  maxSourceFileBytes: 8388608
