site_name: Theurian
site_url: https://theurian.github.io/theurian/

repo_name: theurian/theurian
repo_url: https://github.com/theurian/theurian
edit_uri: edit/main/docs/

# Pages that stay in the repository and out of the published site.
#
# Four are project-process documents — how this project is run, rather than how
# Theurian works: the work logs, the ADR template, the repository strategy and
# the release procedure. architecture/cloud-ready-design.md is excluded for a
# different reason: it is forward-looking design for a deployment that does not
# exist yet, and is curated out of the site rather than published as current.
#
# The leading slash on /work-logs/ anchors the pattern to the top of docs/.
# These are gitignore patterns, so an unanchored work-logs/ would also exclude a
# directory of that name at any depth. The anchor cuts both ways: a work-logs
# directory anywhere else under docs/ would be published. Top level only is the
# intended scope.
#
# Two kinds of link have to be written as an absolute GitHub URL, and the build
# does not treat them alike:
#
#   - to a page excluded above: reported at INFO only, and MkDocs still emits a
#     site-internal URL for it, which 404s once published. --strict does not
#     fail on INFO, so convention and review are the only thing holding this
#     one.
#   - to a repository file outside docs/: reported as a WARNING, so --strict
#     does fail the build. The gate holds this one.
exclude_docs: |
  /work-logs/
  adr/0000-adr-template.md
  architecture/cloud-ready-design.md
  architecture/repository-strategy.md
  contributing/release.md

# A relative link MkDocs cannot classify — a directory-form link such as
# ../../schemas/mcp/ — is reported at INFO by default, so --strict lets it
# through and the link ships broken. Raising it to a warning makes the build
# fail on it. This does not cover links to excluded pages: MkDocs floors that
# message at INFO regardless of configuration, so the convention above is
# still the only thing holding it.
validation:
  links:
    unrecognized_links: warn

theme:
  name: readthedocs

  # The theme otherwise loads highlight.js and its stylesheet from
  # cdnjs.cloudflare.com on every page, with no integrity attribute. GitHub
  # Pages cannot send a Content-Security-Policy, so nothing else would
  # constrain that origin. Turning it off leaves the site with no third-party
  # script or stylesheet at all; code blocks keep their language-* classes and
  # are simply not coloured.
  highlightjs: false

plugins:
  - search

# The landing page centres its hero and closing call to action in a div.
# Python-Markdown does not process Markdown inside a block-level HTML element,
# so without this the headings and links in those divs are published as literal
# source text. The extension is half of the fix; each div also needs
# markdown="1", which is what actually opts its content back in.
markdown_extensions:
  - md_in_html

# Only these two small files are loaded by every page. mermaid-init.js asks for
# the 3,566,058-byte mermaid bundle itself, and only on a page that actually
# has a diagram. A page without one makes no bundle request and pays 6,925
# bytes uncompressed across the two: 6,384 for js/mermaid-init.js and 541 for
# css/mermaid.css. That is 24 of the 44 published markdown pages, or 26 of the
# 47 served HTML files, since 404.html and search.html load them too. The
# forty-seventh is google150fa28bebf014f3.html, the Search Console verification
# token documented at the end of this file, which requests neither.
#
# Re-measured 2026-08-20 against the branch that adds docs/roadmap.md, by
# building the site and counting the built output rather than the sources. The
# key for "has a diagram" is the selector js/mermaid-init.js actually uses,
# `pre > code.language-mermaid`; counting ```mermaid fences in the sources
# instead would also count fences inside excluded pages. Twenty built pages
# match it, so the no-diagram counts — 24 and 26 — did not move when this page
# was added: docs/roadmap.md carries two diagrams and joined the matching set,
# not the paying-only-the-pair set. Both totals did move, by one each.
#
# docs/js/mermaid.min.js is not in the repository. The Pages workflow fetches
# it, checksum-verified, before the build, and a local build has to do the
# same. The version and hash below are a copy of the workflow's job-level env
# and have to move whenever that pin moves. The checksum line has to stay on
# one line with two spaces before the filename; broken across a continuation it
# reports a missing file even when the file is correct:
#
#   mkdir -p docs/js
#   curl -fsSL --proto '=https' --proto-redir '=https' \
#     https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js \
#     -o docs/js/mermaid.min.js
#   echo "18327bef70d96fb505fe7287d9f6a7362ebf07ff6576ddfaffb1a06f3e1a2954  docs/js/mermaid.min.js" | sha256sum -c -
#
# `shasum -a 256 -c -` takes the same input and is available everywhere, if
# sha256sum is not on the path.
#
# Forgetting the fetch is not a build error — MkDocs copies what is there and
# exits 0 — so the workflow verifies the bundle in the built site afterwards.
extra_javascript:
  - js/mermaid-init.js

extra_css:
  - css/mermaid.css

# docs/google150fa28bebf014f3.html is Google's ownership-verification token for
# https://theurian.github.io/theurian/. No key in this file names it: MkDocs
# copies non-Markdown files under docs/ into the site verbatim, and that alone
# is what serves it at the site root. So it survives no nav or exclude_docs
# review, and a docs reorganisation is where it would be lost.
#
# Deleting it, renaming it, or moving it into a subdirectory of docs/ takes it
# off the URL Google fetches. Search Console periodically re-checks the token;
# if it can no longer be confirmed, the owners are notified and permissions
# expire after a grace period.
#
# Its content is generated by Google, whose instruction is to upload the file
# without any modifications, and which states that verification fails if the
# file name or content does not match. So it must not be edited — not even to
# add a comment saying so, which is why this paragraph is here rather than in
# the file. It has no trailing newline, and .editorconfig exempts it from
# insert_final_newline so that saving it does not add one. The documented
# behaviour above is at https://support.google.com/webmasters/answer/9008080.
#
# The Pages workflow compares the built copy against the source with cmp, for
# the same reason it checksums the mermaid bundle: MkDocs copying a file, or
# failing to, is not a build error either way. Removing the token means
# removing the Pages workflow's "Check the verification token reached the site
# intact" step in the same change; otherwise the build fails and the site stops
# deploying.
