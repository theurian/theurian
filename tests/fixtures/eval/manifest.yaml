contractVersion: 1
corpusId: adr-corpus-v1
description: >-
  The Phase A frozen retrieval-evaluation corpus (ADR-0036 decision 6). Twenty-six visible-plane
  items build the `clean` index: twelve verbatim ADR snapshots taken at
  111ab5732dd71efb35f5ecbcd155d75f65ee7de0 and fourteen original documents covering a superseded
  chain, a conflicting pair, three Japanese bodies and four runbook-shaped documents. Seven
  withheld-plane items build only the `full` index and exist to be not returned. Item counts
  below are fixed from the migration documents and were confirmed against a real apply. Chunk
  counts measured via the real apply+index path at authoring; they freeze at the S2 joint build.
  Both were measured under `theurian index build --include-unapproved` at the shipped `internal`
  serving ceiling, the only flavour in which the `full` index holds a withheld row at all: a
  plain `index build` yields 609 for both corpora, because `may_surface` admits draft and
  proposed only under that flag and admits deprecated, superseded and rejected under none. Two
  of the seven withheld items reach the index; the other five are withheld before it. The
  response-equality battery is non-vacuous for the draft and the proposed member alone, whose
  withholding is the query-time gate; the other five are tested by this census instead,
  `full.items` counting them applied and `full.chunks` counting them excluded. The
  superseded-knowledge error rate this corpus yields is zero by build-time exclusion rather than
  by ranking; the chain judgements are retained so that metric reddens if a superseded row is
  ever indexed.
kValues:
- 1
- 5
- 10
